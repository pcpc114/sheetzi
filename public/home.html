<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시트지 — 내 문서</title>
  <meta name="description" content="시트지 문서 목록">
  <meta name="color-scheme" content="light dark">
  <!-- Inline SVG favicon: the app makes no external requests, here or anywhere. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a73e8'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='8' width='18' height='3.4' rx='1'/%3E%3Crect x='7' y='14' width='7.6' height='3.4' rx='1'/%3E%3Crect x='17.4' y='14' width='7.6' height='3.4' rx='1'/%3E%3Crect x='7' y='20' width='7.6' height='3.4' rx='1'/%3E%3Crect x='17.4' y='20' width='7.6' height='3.4' rx='1'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="sz-home">

  <header class="sz-home-header">
    <a class="sz-home-logo" href="/" aria-label="시트지 홈">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="7" fill="currentColor"></rect>
        <g fill="#fff">
          <rect x="7" y="8" width="18" height="3.4" rx="1"></rect>
          <rect x="7" y="14" width="7.6" height="3.4" rx="1"></rect>
          <rect x="17.4" y="14" width="7.6" height="3.4" rx="1"></rect>
          <rect x="7" y="20" width="7.6" height="3.4" rx="1"></rect>
          <rect x="17.4" y="20" width="7.6" height="3.4" rx="1"></rect>
        </g>
      </svg>
      <span>시트지</span>
    </a>

    <div class="sz-home-tools">
      <label class="sz-home-search">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8.5 3a5.5 5.5 0 1 1-3.4 9.8l-2.4 2.5-1.1-1.1 2.5-2.4A5.5 5.5 0 0 1 8.5 3Zm0 1.6a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Z"></path>
        </svg>
        <input id="sz-home-search" type="search" placeholder="문서 검색" aria-label="문서 이름으로 검색" autocomplete="off" spellcheck="false">
      </label>

      <label class="sz-home-sort">
        <span class="sz-visually-hidden">정렬</span>
        <select id="sz-home-sort" aria-label="정렬 기준">
          <option value="recent">최근 수정순</option>
          <option value="name">이름순</option>
        </select>
      </label>
    </div>
  </header>

  <main class="sz-home-main">
    <h1 class="sz-home-title">내 문서</h1>
    <div id="sz-home-grid" class="sz-home-grid" role="list" aria-label="문서 목록"></div>
  </main>

  <div id="sz-toasts" class="sz-toasts" role="region" aria-live="polite" aria-label="알림"></div>

  <noscript>
    <p style="padding:24px;font:16px system-ui">
      시트지를 쓰려면 자바스크립트를 켜야 합니다.
    </p>
  </noscript>

  <script type="module" src="./js/home.js"></script>
</body>
</html>
